name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - postCompileHook.js
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip release]')) }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check main head
        id: freshness
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.freshness.outputs.current == 'true'
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.current == 'true'
        with:
          node-version: 24
      - uses: wrightkit/setup-wright@v1
        if: steps.freshness.outputs.current == 'true'
      - name: Install OverPy provider
        if: steps.freshness.outputs.current == 'true'
        run: wright update provider opy
      - name: Update version
        if: steps.freshness.outputs.current == 'true'
        id: version
        run: |
          pnpm run bump:version
          version="$(sed -n 's/^#!define MODE_VERSION "v\([^"]*\)"$/\1/p' src/ui/hud.opy)"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Compile
        if: steps.freshness.outputs.current == 'true'
        run: pnpm run compile
      - name: Commit version
        if: steps.freshness.outputs.current == 'true'
        id: commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.opy src/ui/hud.opy
          git commit -m 'chore(release): bump ${{ steps.version.outputs.tag }} [skip release]'
          git push origin HEAD:main
      - name: Publish release
        if: steps.freshness.outputs.current == 'true' && steps.commit.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" main.compiled.ow --title "$RELEASE_TAG" --generate-notes
